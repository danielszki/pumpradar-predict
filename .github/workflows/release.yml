name: Build .deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: ./build_deb.sh

      - name: Sanity check package
        run: |
          dpkg-deb -I build/*.deb | grep -E "Package|Version|Architecture|Depends"
          test -f build/*.deb

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb